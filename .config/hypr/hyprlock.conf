source = ~/.config/omarchy/current/theme/hyprlock.conf
 
general {
    ignore_empty_input = true
}

background {
    monitor = # LAPTOP
    color = $color
    path = ~/Pictures/rei.png # LAPTOP
    blur_passes = 0
}

animations {
    enabled = false
}

input-field {
    monitor =
    size = 400, 60
    position = 0, 0
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 4

    font_family = Agave Nerd Font Mono
    font_color = $font_color

    placeholder_text = <span> Enter Password 󰈷 </span>
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 20
    shadow_passes = 2
    fade_on_empty = false
}

auth {
    fingerprint:enabled = true
}
