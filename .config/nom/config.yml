database: nom.db
ordering: asc
filtering:
    defaultIncludeFeedName: false
theme:
    glamour: /home/denial/.config/glow/matrix.json
    titleColor: "62"
    titleColorFg: "231"
    filterColor: "62"
    selectedItemColor: "170"
    readIcon: ✓
http:
    mintls: TLS 1.2
refreshinterval: 5
